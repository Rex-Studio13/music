<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Music Player</title>
<style>
  body{font-family:system-ui,sans-serif;background:#121212;color:#fff;margin:0;padding:16px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  h1{font-size:1.3rem}
  #player{width:100%;max-width:480px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
  #player iframe{width:100%;height:100%;border:0}
  .add{display:flex;gap:8px;width:100%;max-width:480px;margin:12px 0}
  .add input{flex:1;padding:10px;border-radius:8px;border:none;font-size:1rem}
  .controls{display:flex;gap:12px;margin:14px 0}
  button{background:#1db954;border:none;color:#fff;padding:10px 18px;border-radius:999px;font-size:1rem;cursor:pointer}
  #list{width:100%;max-width:480px;list-style:none;padding:0;margin:0}
  #list li{padding:10px;border-radius:8px;cursor:pointer;background:#1e1e1e;margin-bottom:6px}
  #list li.active{background:#1db954}
</style>
</head>
<body>
<h1>🎵 My Music Player</h1>
  
<div class="add">
  <input id="url" placeholder="Tempel link YouTube...">
  <button onclick="addSong()">+</button>
</div>

<div id="player"><div id="yt"></div></div>

<div class="controls">
  <button onclick="prev()">⏮</button>
  <button onclick="togglePlay()">⏯</button>
  <button onclick="next()">⏭</button>
</div>

<ul id="list"></ul>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let songs = JSON.parse(localStorage.getItem("songs") || "null") || [
  { id: "dQw4w9WgXcQ", title: "Contoh lagu" } // ganti dengan ID video kamu
];
let player, current = 0, ready = false;

function extractId(url){
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function save(){
  try { localStorage.setItem("songs", JSON.stringify(songs)); } catch(e){}
}

function addSong(){
  const input = document.getElementById("url");
  const id = extractId(input.value.trim());
  if(!id){ alert("Link YouTube tidak valid"); return; }
  const title = prompt("Judul lagu:", "Lagu " + (songs.length + 1));
  if(!title) return;
  songs.push({ id, title });
  save();
  input.value = "";
  renderList();
  if(songs.length === 1) loadSong(0, false);
}

function onYouTubeIframeAPIReady(){
  player = new YT.Player("yt", {
    height: "100%", width: "100%",
    playerVars: { playsinline: 1 },
    events: {
      onReady: () => { ready = true; if(songs.length) loadSong(current, false); },
      onStateChange: (e) => { if(e.data === YT.PlayerState.ENDED) next(); }
    }
  });
}

function loadSong(i, autoplay = true){
  current = i;
  renderList();
  if(!ready) return;
  autoplay ? player.loadVideoById(songs[i].id) : player.cueVideoById(songs[i].id);
}

function togglePlay(){
  if(!ready) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
}

function next(){ if(songs.length) loadSong((current + 1) % songs.length); }
function prev(){ if(songs.length) loadSong((current - 1 + songs.length) % songs.length); }

function renderList(){
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  songs.forEach((s, i) => {
    const li = document.createElement("li");
    li.textContent = (i + 1) + ". " + s.title;
    if(i === current) li.classList.add("active");
    li.onclick = () => loadSong(i);
    ul.appendChild(li);
  });
}

renderList();
</script>
</body>
</html>
